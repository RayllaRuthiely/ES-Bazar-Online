{% extends 'base.html' %}

{% block content %}
<div class="pagina-sucesso">
    <div class="icone-sucesso" aria-hidden="true">✔</div>
    <h1 class="titulo-sucesso">Anúncio publicado com sucesso</h1>

    <div class="card-resumo">
        {% if produto.foto %}
            <img class="foto-resumo" src="{{ produto.foto }}" alt="Foto de {{ produto.nome }}">
        {% else %}
            <div class="foto-resumo sem-foto">Sem foto</div>
        {% endif %}

        <h2 class="nome-resumo">{{ produto.nome }}</h2>
        <p class="preco-resumo">R$ {{ "%.2f"|format(produto.preco)|replace(".", ",") }}</p>
        <p class="status-resumo">Status: {{ produto.status }}</p>
    </div>

    <div class="acoes-sucesso">
        <a href="/meus-anuncios" class="btn-preto botao-link">Ver meus anúncios</a>
        <a href="/catalogo" class="btn-branco botao-link">Voltar ao catálogo</a>
    </div>
</div>
{% endblock %}
