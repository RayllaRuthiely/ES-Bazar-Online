<!DOCTYPE html>
<html lang="pt-br"> 

<head>
     <meta charset="UTF-8">
    <title>Login de Usuário</title>		
</head>

<body>
    <h1>Login de Usuário</h1> 

    <form action="/login" method="POST">	

        <label>E-mail:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Senha:</label>
        <input type="password" name="senha" required>

        <br><br>

        <button type="submit">Entrar</button>

    </form>

        {% if mensagem %}
        <p>{{ mensagem }}</p>
    {% endif %}

</body>
</html>
