{% extends 'base.html' %}

{% block content %}
<div class="pagina-novo-anuncio">
    <h1 class="titulo-novo-anuncio">Novo Anúncio</h1>

    <!-- Mensagem de erro do protótipo -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alerta-prototipo">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/novo-anuncio" method="POST" enctype="multipart/form-data">
        <label for="input-foto" class="box-upload-foto">
            <span>Adicionar fotos</span>
            <input type="file" id="input-foto" name="foto" accept="image/*" hidden>
        </label>

        <input type="text" name="titulo" placeholder="Título">
        <input type="text" name="descricao" placeholder="Descrição">
        <input type="number" step="0.01" name="preco" placeholder="Preço">

        <select name="categoria">
            <option value="" selected>Categoria</option>
            <option value="Roupas">Roupas</option>
            <option value="Calçados">Calçados</option>
            <option value="Acessórios">Acessórios</option>
            <option value="Outros">Outros</option>
        </select>

        <div class="linha-botoes-anuncio">
            <a href="/catalogo" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-publicar">Publicar</button>
        </div>
    </form>
</div>
{% endblock %}
